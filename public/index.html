<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ahmo.io</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1e272e; color: #f5f6fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; user-select: none;
        }

        /* SADE KLASİK MENÜ VE PANELLER */
        .panel {
            background: #2f3640; border: 2px solid #718093;
            border-radius: 8px; padding: 25px; width: 360px;
            display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 20;
        }
        h1 { text-align: center; font-size: 36px; color: #e84118; margin-bottom: 5px; }
        h2 { text-align: center; font-size: 20px; color: #dcdde1; margin-bottom: 10px; }
        
        .btn {
            background: #353b48; border: 1px solid #718093; color: #fff;
            padding: 10px; font-size: 15px; font-weight: bold; border-radius: 6px;
            cursor: pointer; transition: 0.1s; text-align: center;
        }
        .btn:hover { background: #4b6584; }
        .btn-primary { background: #44bd32; border-color: #4cd137; }
        .btn-primary:hover { background: #4cd137; }
        .btn-danger { background: #c23616; border-color: #e84118; }
        
        input, select {
            background: #1e272e; border: 1px solid #718093; color: #fff;
            padding: 9px; border-radius: 6px; font-size: 14px; outline: none;
        }
        .row { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
        .coin-badge { background: #e1b12c; color: #000; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 14px; }

        /* OYUN İÇİ SADE HUD */
        #hud {
            position: absolute; top: 12px; display: none;
            flex-direction: column; align-items: center; z-index: 10; gap: 5px;
        }
        #timerBox {
            background: #2f3640; border: 2px solid #718093;
            padding: 4px 20px; border-radius: 6px; font-size: 24px; font-weight: bold;
        }
        #hudInfo { font-size: 14px; font-weight: bold; }

        /* MOBİL DOKUNMATİK KONTROLLER */
        #mobileControls {
            position: absolute; bottom: 20px; width: 100%; max-width: 800px;
            display: none; justify-content: space-between; padding: 0 25px; z-index: 15;
            pointer-events: none;
        }
        .dpad {
            display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px);
            gap: 5px; pointer-events: auto;
        }
        .dpad-btn {
            background: rgba(47, 54, 64, 0.7); border: 2px solid #718093;
            color: #fff; font-size: 20px; font-weight: bold; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }
        .action-btn {
            width: 75px; height: 75px; background: #e84118; border: 2px solid #fff;
            border-radius: 50%; color: #fff; font-weight: bold; font-size: 13px;
            pointer-events: auto; display: flex; align-items: center; justify-content: center;
            align-self: flex-end;
        }

        canvas { border: 2px solid #718093; background: #000; display: none; }
    </style>
</head>
<body>

    <!-- SADE SAYAÇ VE BİLGİ -->
    <div id="hud">
        <div id="timerBox">00:15</div>
        <div id="hudInfo">Rol: Bekleniyor... | Coin: <span id="gameCoin">0</span></div>
    </div>

    <!-- 1. ANA MENÜ -->
    <div class="panel" id="mainMenu">
        <h1>ahmo.io</h1>
        <div class="row">
            <span>Bakiye:</span>
            <span class="coin-badge">💰 <span id="coinCount">0</span> Coin</span>
        </div>
        <div class="row">
            <label>Cihaz:</label>
            <select id="deviceSelect">
                <option value="pc">Bilgisayar (Klavye)</option>
                <option value="mobile">Mobil (Dokunmatik)</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="showLobbyList()">OYNA</button>
        <button class="btn" onclick="showCreateScreen()">Lobi Oluştur</button>
    </div>

    <!-- 2. LOBİ LİSTESİ / KATILMA EKRANI -->
    <div class="panel" id="lobbyListMenu" style="display: none;">
        <h2>Lobiler</h2>
        <div id="lobbiesContainer" style="max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px;"></div>
        <div class="row">
            <input type="text" id="customJoinCode" placeholder="Oda Kodu (örn: AB12)" maxlength="6">
            <button class="btn btn-primary" onclick="joinByCode()">Katıl</button>
        </div>
        <button class="btn btn-danger" onclick="backToMain()">Geri</button>
    </div>

    <!-- 3. LOBİ OLUŞTURMA SAYFASI -->
    <div class="panel" id="createMenu" style="display: none;">
        <h2>Lobi Oluştur</h2>
        <label>Harita Seç:</label>
        <select id="createMap">
            <option value="labirent">Labirent (Klasik)</option>
            <option value="bahce">Bahçe</option>
            <option value="laboratuvar">Laboratuvar</option>
        </select>
        <label>Kişi Sayısı (2-10):</label>
        <select id="createMaxPlayers">
            <option value="2">2 Kişi (1 Arayan)</option>
            <option value="4">4 Kişi (1 Arayan)</option>
            <option value="5" selected>5 Kişi (1 Arayan)</option>
            <option value="8">8 Kişi (2 Arayan)</option>
            <option value="10">10 Kişi (2 Arayan)</option>
        </select>
        <label>Gizlilik:</label>
        <select id="createPrivacy" onchange="toggleCodeInput()">
            <option value="public">Herkese Açık</option>
            <option value="private">Özel (Kod ile)</option>
        </select>
        <input type="text" id="createCustomCode" placeholder="Özel Oda Kodu Yaz" maxlength="6" style="display: none;">
        <button class="btn btn-primary" onclick="submitCreateLobby()">Oluştur ve Başla</button>
        <button class="btn btn-danger" onclick="backToMain()">Geri</button>
    </div>

    <!-- MOBİL KONTROLLER -->
    <div id="mobileControls">
        <div class="dpad">
            <div></div>
            <button class="dpad-btn" id="mUp">▲</button>
            <div></div>
            <button class="dpad-btn" id="mLeft">◀</button>
            <div></div>
            <button class="dpad-btn" id="mRight">▶</button>
            <div></div>
            <button class="dpad-btn" id="mDown">▼</button>
            <div></div>
        </div>
        <button class="action-btn" id="mAction">TUZAK<br>(E)</button>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Coin Kaydı
let myCoins = parseInt(localStorage.getItem("ahmo_coins") || "0");
function updateCoinUI() {
    document.getElementById("coinCount").innerText = myCoins;
    document.getElementById("gameCoin").innerText = myCoins;
    localStorage.setItem("ahmo_coins", myCoins);
}
updateCoinUI();

let isMobile = false;
let myId = null;
let currentMap = "labirent";
let players = {};
let coins = [];
let traps = [];
let isSeeker = false;
let gameState = "WAITING";
let jailAlertPos = null;

const myPlayer = {
    x: 730, y: 530, radius: 12,
    hiderSpeed: 3.2,
    seekerSpeed: 3.52, // Arayanlar %10 daha hızlı
    viewDistance: 130,
    isFrozen: false
};

// ==========================================
// HARİTA VERİLERİ (3 HARİTA)
// ==========================================
const MAPS = {
    labirent: {
        bg: "#595959",
        spawn: { x: 680, y: 480, w: 120, h: 120 },
        walls: [
            { x: 0, y: 0, w: 800, h: 10 }, { x: 0, y: 590, w: 800, h: 10 }, { x: 0, y: 0, w: 10, h: 600 }, { x: 790, y: 0, w: 10, h: 600 },
            { x: 90, y: 60, w: 45, h: 260 }, { x: 250, y: 0, w: 45, h: 110 }, { x: 250, y: 170, w: 260, h: 45 },
            { x: 465, y: 70, w: 45, h: 145 }, { x: 630, y: 170, w: 170, h: 45 }, { x: 360, y: 330, w: 280, h: 45 },
            { x: 595, y: 330, w: 45, h: 270 }, { x: 120, y: 460, w: 290, h: 45 }
        ]
    },
    bahce: {
        bg: "#6ab04c",
        spawn: { x: 680, y: 480, w: 120, h: 120 },
        walls: [
            { x: 0, y: 0, w: 800, h: 10 }, { x: 0, y: 590, w: 800, h: 10 }, { x: 0, y: 0, w: 10, h: 600 }, { x: 790, y: 0, w: 10, h: 600 },
            { x: 90, y: 200, w: 60, h: 250 }, { x: 90, y: 390, w: 250, h: 60 }, // L çim engel
            { x: 300, y: 80, w: 240, h: 60 },                                   // Üst yeşil bar
            { x: 500, y: 240, w: 200, h: 200 }                                  // Sağ büyük yeşil kare
        ],
        decorations: [
            { type: 'path', x: 20, y: 100, w: 740, h: 500 },
            { type: 'circle', x: 100, y: 60, r: 25, color: '#f0932b' },
            { type: 'circle', x: 680, y: 70, r: 25, color: '#f0932b' },
            { type: 'circle', x: 320, y: 300, r: 25, color: '#f0932b' },
            { type: 'circle', x: 540, y: 500, r: 25, color: '#f0932b' }
        ]
    },
    laboratuvar: {
        bg: "#7f8c8d",
        spawn: { x: 340, y: 510, w: 120, h: 90 },
        walls: [
            { x: 0, y: 0, w: 800, h: 10 }, { x: 0, y: 590, w: 800, h: 10 }, { x: 0, y: 0, w: 10, h: 600 }, { x: 790, y: 0, w: 10, h: 600 },
            { x: 100, y: 0, w: 90, h: 180 }, { x: 610, y: 0, w: 90, h: 180 },
            { x: 100, y: 420, w: 90, h: 180 }, { x: 610, y: 420, w: 90, h: 180 },
            { x: 60, y: 250, w: 180, h: 90 }, { x: 560, y: 250, w: 180, h: 90 },
            { x: 310, y: 210, w: 180, h: 180 } // Merkez sütun
        ]
    }
};

let currentWalls = [];
let segments = [];
function setMap(mapName) {
    currentMap = mapName;
    currentWalls = MAPS[mapName].walls;
    segments = [];
    currentWalls.forEach(o => {
        segments.push({ a: {x: o.x, y: o.y}, b: {x: o.x + o.w, y: o.y} });
        segments.push({ a: {x: o.x + o.w, y: o.y}, b: {x: o.x + o.w, y: o.y + o.h} });
        segments.push({ a: {x: o.x + o.w, y: o.y + o.h}, b: {x: o.x, y: o.y + o.h} });
        segments.push({ a: {x: o.x, y: o.y + o.h}, b: {x: o.x, y: o.y} });
    });
}

// Raycasting Fonksiyonları
function getRayIntersection(ray, seg) {
    const dx = ray.b.x - ray.a.x, dy = ray.b.y - ray.a.y;
    const sx = seg.b.x - seg.a.x, sy = seg.b.y - seg.a.y;
    const denom = dx * sy - dy * sx;
    if (denom === 0) return null;
    const t = ((seg.a.x - ray.a.x) * sy - (seg.a.y - ray.a.y) * sx) / denom;
    const u = ((seg.a.x - ray.a.x) * dy - (seg.a.y - ray.a.y) * dx) / denom;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1) return { x: ray.a.x + t * dx, y: ray.a.y + t * dy, dist: t };
    return null;
}

function calculateVisibility(px, py, radius) {
    const rays = 180; const points = [];
    for (let i = 0; i < rays; i++) {
        const angle = (i / rays) * Math.PI * 2;
        const ray = { a: { x: px, y: py }, b: { x: px + Math.cos(angle) * radius, y: py + Math.sin(angle) * radius } };
        let closest = { x: ray.b.x, y: ray.b.y, dist: 1 };
        for (let seg of segments) {
            const hit = getRayIntersection(ray, seg);
            if (hit && hit.dist < closest.dist) closest = hit;
        }
        points.push(closest);
    }
    return points;
}

// Kontroller
const keys = {};
window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key.toLowerCase() === 'e' || e.key === ' ') useTrap();
});
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// Menü Geçişleri
function backToMain() {
    document.getElementById("mainMenu").style.display = "flex";
    document.getElementById("lobbyListMenu").style.display = "none";
    document.getElementById("createMenu").style.display = "none";
}
function showCreateScreen() {
    document.getElementById("mainMenu").style.display = "none";
    document.getElementById("createMenu").style.display = "flex";
}
function toggleCodeInput() {
    const p = document.getElementById("createPrivacy").value;
    document.getElementById("createCustomCode").style.display = (p === "private") ? "block" : "none";
}
function showLobbyList() {
    document.getElementById("mainMenu").style.display = "none";
    document.getElementById("lobbyListMenu").style.display = "flex";
    socket.emit("getPublicLobbies");
}

function submitCreateLobby() {
    isMobile = document.getElementById("deviceSelect").value === "mobile";
    socket.emit("joinOrCreate", {
        action: "create",
        map: document.getElementById("createMap").value,
        maxPlayers: document.getElementById("createMaxPlayers").value,
        isPrivate: document.getElementById("createPrivacy").value === "private",
        customCode: document.getElementById("createCustomCode").value
    });
}

function joinByCode() {
    isMobile = document.getElementById("deviceSelect").value === "mobile";
    socket.emit("joinOrCreate", { action: "join", roomId: document.getElementById("customJoinCode").value });
}

// Socket Yanıtları
socket.on("publicLobbiesList", list => {
    const box = document.getElementById("lobbiesContainer");
    box.innerHTML = "";
    if (list.length === 0) {
        box.innerHTML = "<p style='color:#aaa; font-size:13px; text-align:center;'>Açık lobi yok.</p>";
        return;
    }
    list.forEach(l => {
        const d = document.createElement("div");
        d.className = "row";
        d.style.background = "#353b48"; d.style.padding = "6px"; d.style.borderRadius = "4px";
        d.innerHTML = `<span>[${l.map.toUpperCase()}] ${l.playersCount}/${l.maxPlayers}</span>
                       <button class="btn btn-primary" style="padding:4px 10px;" onclick="joinSpecific('${l.id}')">Gir</button>`;
        box.appendChild(d);
    });
});

function joinSpecific(id) {
    isMobile = document.getElementById("deviceSelect").value === "mobile";
    socket.emit("joinOrCreate", { action: "join", roomId: id });
}

socket.on("joinedSuccess", data => {
    myId = data.myId; players = data.players;
    setMap(data.map);
    document.getElementById("mainMenu").style.display = "none";
    document.getElementById("lobbyListMenu").style.display = "none";
    document.getElementById("createMenu").style.display = "none";
    document.getElementById("hud").style.display = "flex";
    canvas.style.display = "block";
    if (isMobile) document.getElementById("mobileControls").style.display = "flex";
});

socket.on("playerListUpdate", data => {
    const count = Object.keys(data.players).length;
    document.getElementById("hudInfo").innerText = `Lobi Bekleniyor (${count}/${data.maxPlayers})`;
});

socket.on("timerUpdate", d => {
    gameState = d.state; coins = d.coins || [];
    let m = Math.floor(d.timer / 60).toString().padStart(2, '0');
    let s = (d.timer % 60).toString().padStart(2, '0');
    document.getElementById("timerBox").innerText = `${m}:${s}`;
});

socket.on("gameStarted", d => {
    gameState = d.state; players = d.players; coins = d.coins;
    setMap(d.map);
    isSeeker = players[myId].isSeeker;
    const sp = MAPS[currentMap].spawn;
    myPlayer.x = sp.x + sp.w / 2; myPlayer.y = sp.y + sp.h / 2;
    document.getElementById("hudInfo").innerText = isSeeker ? "Rol: ARAYAN (Hızlı & Görüş Dar)" : "Rol: SAKLANAN (Tam Görüş)";
    document.getElementById("hudInfo").style.color = isSeeker ? "#e84118" : "#4cd137";
});

socket.on("playerMoved", p => { if(players[p.id]) { players[p.id].x = p.x; players[p.id].y = p.y; } });
socket.on("coinCollected", d => {
    coins = coins.filter(c => c.id !== d.coinId);
    if (d.collectorId === myId) {
        myCoins += 1;
        updateCoinUI();
    }
});
socket.on("trapPlaced", t => traps.push(t));
socket.on("trapTriggered", d => {
    traps = traps.filter(t => t.id !== d.trapId);
    if (d.victimId === myId) {
        myPlayer.isFrozen = true;
        alert(`Tuzağa yakalandın! ${d.duration} saniye dondu.`);
    }
    if (isSeeker && d.alertSeeker) {
        jailAlertPos = { x: d.x, y: d.y };
        setTimeout(() => jailAlertPos = null, 5000);
    }
});
socket.on("playerUnfrozen", id => { if(id === myId) myPlayer.isFrozen = false; });
socket.on("playerCaught", d => { if(players[d.targetId]) players[d.targetId].isAlive = false; });
socket.on("gameOver", d => alert(d.winner === "SEEKERS" ? "Arayanlar Kazandı!" : "Saklananlar Kazandı!"));
socket.on("roomReset", () => { myPlayer.isFrozen = false; traps = []; jailAlertPos = null; });
socket.on("errorMsg", m => alert(m));

// Tuzak Kullanma Mantığı
function useTrap() {
    if (myPlayer.isFrozen || gameState !== "SEEKING") return;
    if (isSeeker) {
        // Jail Tuzağı (15 Coin)
        if (myCoins >= 15) {
            myCoins -= 15; updateCoinUI();
            socket.emit("placeTrap", { type: "jail", x: myPlayer.x, y: myPlayer.y });
        } else alert("Jail Tuzağı için 15 Coin gerekli!");
    } else {
        // Yapışkan Tuzak (10 Coin)
        if (myCoins >= 10) {
            myCoins -= 10; updateCoinUI();
            socket.emit("placeTrap", { type: "sticky", x: myPlayer.x, y: myPlayer.y });
        } else alert("Yapışkan Tuzak için 10 Coin gerekli!");
    }
}

// Mobil Buton Bağlantıları
if ('ontouchstart' in window) {
    const bindBtn = (id, k) => {
        const el = document.getElementById(id);
        el.addEventListener("touchstart", (e) => { e.preventDefault(); keys[k] = true; });
        el.addEventListener("touchend", (e) => { e.preventDefault(); keys[k] = false; });
    };
    bindBtn("mUp", "w"); bindBtn("mDown", "s"); bindBtn("mLeft", "a"); bindBtn("mRight", "d");
    document.getElementById("mAction").addEventListener("touchstart", (e) => { e.preventDefault(); useTrap(); });
}

// Oyun Döngüsü
function update() {
    if (myPlayer.isFrozen || (isSeeker && gameState === "HIDING")) return;

    let mx = 0, my = 0;
    if (keys['w'] || keys['arrowup']) my -= 1;
    if (keys['s'] || keys['arrowdown']) my += 1;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;

    let spd = isSeeker ? myPlayer.seekerSpeed : myPlayer.hiderSpeed;
    if (mx !== 0 && my !== 0) { mx *= 0.7071; my *= 0.7071; }

    let nx = myPlayer.x + mx * spd;
    let ny = myPlayer.y + my * spd;

    let hitX = currentWalls.some(o => nx + 12 > o.x && nx - 12 < o.x + o.w && myPlayer.y + 12 > o.y && myPlayer.y - 12 < o.y + o.h);
    let hitY = currentWalls.some(o => myPlayer.x + 12 > o.x && myPlayer.x - 12 < o.x + o.w && ny + 12 > o.y && ny - 12 < o.y + o.h);

    if (!hitX) myPlayer.x = nx;
    if (!hitY) myPlayer.y = ny;

    if (mx !== 0 || my !== 0) socket.emit("playerMove", { x: myPlayer.x, y: myPlayer.y });

    // Coin Alma Kontrolü
    coins.forEach(c => {
        if (Math.hypot(c.x - myPlayer.x, c.y - myPlayer.y) < 18) {
            socket.emit("collectCoin", c.id);
        }
    });

    // Tuzağa Basma Kontrolü
    traps.forEach(t => {
        if (Math.hypot(t.x - myPlayer.x, t.y - myPlayer.y) < 18) {
            socket.emit("triggerTrap", t.id);
        }
    });

    // Arayan Saklananı Yakalar
    if (isSeeker && gameState === "SEEKING") {
        for (let id in players) {
            if (id !== myId && players[id].isAlive && !players[id].isSeeker) {
                if (Math.hypot(players[id].x - myPlayer.x, players[id].y - myPlayer.y) < 24) {
                    socket.emit("catchPlayer", id);
                }
            }
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const mapData = MAPS[currentMap];

    if (isSeeker) {
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const poly = calculateVisibility(myPlayer.x, myPlayer.y, myPlayer.viewDistance);
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(poly[0].x, poly[0].y);
        for (let p of poly) ctx.lineTo(p.x, p.y);
        ctx.closePath();
        ctx.clip();
    }

    // Zemin
    ctx.fillStyle = mapData.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Bahçe Haritası Süsleri
    if (mapData.decorations) {
        mapData.decorations.forEach(d => {
            if (d.type === 'circle') {
                ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
                ctx.fillStyle = d.color; ctx.fill();
            }
        });
    }

    // Spawn Alanı
    ctx.fillStyle = "#e84118";
    ctx.fillRect(mapData.spawn.x, mapData.spawn.y, mapData.spawn.w, mapData.spawn.h);

    // Duvarlar
    ctx.fillStyle = "#2f3640";
    currentWalls.forEach(o => {
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeStyle = "#1e272e";
        ctx.strokeRect(o.x, o.y, o.w, o.h);
    });

    // Coinler
    coins.forEach(c => {
        ctx.beginPath(); ctx.arc(c.x, c.y, 6, 0, Math.PI*2);
        ctx.fillStyle = "#fbc531"; ctx.fill();
        ctx.strokeStyle = "#e1b12c"; ctx.stroke();
    });

    // Tuzaklar
    traps.forEach(t => {
        ctx.beginPath(); ctx.arc(t.x, t.y, 10, 0, Math.PI*2);
        if (t.type === "sticky") {
            ctx.fillStyle = "#9c88ff"; ctx.fill(); // Yapışkan Mor
        } else if (t.type === "jail") {
            ctx.fillStyle = "rgba(47, 54, 64, 0.1)"; // %90 Görünmez Hapis
            ctx.fill();
        }
    });

    // Diğer Oyuncular
    for (let id in players) {
        if (id === myId || !players[id].isAlive) continue;
        let p = players[id];
        ctx.beginPath(); ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
        ctx.fillStyle = p.isSeeker ? "#e84118" : "#4cd137";
        ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.stroke();
    }

    if (isSeeker) ctx.restore();

    // Kendini Çiz
    ctx.beginPath(); ctx.arc(myPlayer.x, myPlayer.y, myPlayer.radius, 0, Math.PI * 2);
    ctx.fillStyle = isSeeker ? "#e84118" : "#00a8ff";
    ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();

    // Jail Tuzağına Düşen Biri Varsa Arayana Ok Çiz
    if (isSeeker && jailAlertPos) {
        const angle = Math.atan2(jailAlertPos.y - myPlayer.y, jailAlertPos.x - myPlayer.x);
        const arrowX = myPlayer.x + Math.cos(angle) * 35;
        const arrowY = myPlayer.y + Math.sin(angle) * 35;
        ctx.beginPath(); ctx.arc(arrowX, arrowY, 6, 0, Math.PI*2);
        ctx.fillStyle = "#e84118"; ctx.fill();
    }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
